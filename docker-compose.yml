services:
  # Base de Datos PostgreSQL 16 para QubitPOS
  db:
    image: postgres:16-alpine
    container_name: qubitpos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-qubitpos}
      POSTGRES_USER: ${DB_USERNAME:-qubitpos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qubitpos} -d ${DB_DATABASE:-qubitpos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para colas y caché de alta velocidad
  redis:
    image: redis:7-alpine
    container_name: qubitpos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Backend Laravel (API REST, DIAN UBL 2.1, Nómina & Contabilidad)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qubitpos_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-qubitpos}
      DB_USERNAME: ${DB_USERNAME:-qubitpos}
      DB_PASSWORD: ${DB_PASSWORD:-secret123}
      CACHE_STORE: redis
      REDIS_HOST: redis
    ports:
      - "8000:9000"

  # Frontend Next.js 16 (Caja POS, Facturación, Nómina & Reportes)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qubitpos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
